name: Auditar versiones de perfil (Alfacar, Loja y Zagra)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - scripts/auditar-versiones-perfil.py
      - .github/workflows/auditar-versiones-perfil.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Autenticación segura (sin publicar credenciales)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMPAS_98DD7 }}
      - name: Instalar lector oficial de Firestore
        run: python -m pip install --disable-pip-version-check google-cloud-firestore==2.20.2
      - name: Comprobar sintaxis
        run: python -m py_compile scripts/auditar-versiones-perfil.py
      - name: Consultar las tres bibliotecas y emitir solo metadatos
        run: python scripts/auditar-versiones-perfil.py
