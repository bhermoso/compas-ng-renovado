name: Deploy COMPAS NG to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test profile revisions and evidence links
        run: npx vitest run tests/external-profiles.test.tsx tests/profile-structure.test.ts tests/profile-remote-audit.test.ts tests/profile-audit-direct-entry.test.ts

      - name: Build
        run: npm run build

      - name: Comprobar que existe la página independiente de auditoría
        run: |
          test -s dist/verificar-perfiles.html
          grep -q 'type="module"' dist/verificar-perfiles.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
