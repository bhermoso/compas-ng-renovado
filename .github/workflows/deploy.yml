name: Deploy COMPAS NG to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test profile revisions and evidence links
        run: npx vitest run tests/external-profiles.test.tsx tests/profile-structure.test.ts tests/profile-remote-audit.test.ts tests/profile-audit-direct-entry.test.ts

      - name: Build
        run: npm run build

      - name: Comprobar que existe la página independiente de auditoría
        run: |
          test -s dist/verificar-perfiles.html
          grep -q 'type="module"' dist/verificar-perfiles.html

      - name: Incorporar versión verificable al HTML publicado
        env:
          COMPAS_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("dist/index.html")
          html = path.read_text(encoding="utf-8")
          marker = f'<meta name="compas-build-sha" content="{os.environ["COMPAS_COMMIT"]}">'
          if "</head>" not in html:
              raise SystemExit("Falta </head> en dist/index.html")
          path.write_text(html.replace("</head>", f"    {marker}\n  </head>", 1), encoding="utf-8")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Comprobar commit servido por GitHub Pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          COMPAS_COMMIT: ${{ github.sha }}
        run: |
          test -n "$PAGE_URL"
          for attempt in $(seq 1 18); do
            html=$(curl --fail --silent --show-error --location --max-time 20 --header 'Cache-Control: no-cache' "${PAGE_URL}?compas_verify=${COMPAS_COMMIT}" || true)
            if printf '%s' "$html" | grep -Fq "name=\"compas-build-sha\" content=\"${COMPAS_COMMIT}\""; then
              echo "Pages sirve el commit ${COMPAS_COMMIT}"
              exit 0
            fi
            echo "Esperando propagación de Pages (${attempt}/18)"
            sleep 10
          done
          echo "::error::El despliegue terminó, pero Pages no acredita el commit publicado."
          exit 1
