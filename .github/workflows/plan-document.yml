name: Plan document validation
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tests/document-revisions.test.ts'
      - 'tests/document-access.test.tsx'
      - 'tests/ibse-atarfe-visibility.test.tsx'
      - 'tests/diagnostico-territorial-consolidacion.test.tsx'
      - 'tests/ibse-datadictionary-rejection.test.ts'
      - 'tests/ibse-restoration-audit.test.ts'
      - 'tests/planning-cycle-progress.test.tsx'
      - 'tests/planning-cycle-real-status.test.tsx'
      - 'tests/planning-cycle-layout.test.ts'
      - 'tests/profile-prioritization-fidelity.test.tsx'
      - 'tests/profile-custody-audit.test.ts'
      - 'tests/profile-update-preview-integrity.test.ts'
      - 'tests/compact-platform-layout.test.ts'
      - 'tests/home-context-indicator-compact.test.tsx'
      - 'tests/home-municipality-visible.smoke.mjs'
      - 'tests/document-archive-manager.test.tsx'
      - 'tests/strategic-reference-separation.test.tsx'
      - 'tests/strategic-migration-audit.test.ts'
      - 'tests/municipal-document-organization.test.ts'
      - 'tests/normalize-loja-atarfe-documents.test.ts'
      - 'tests/normalize-loja-remote-guarded.test.ts'
      - 'tests/visual-identity-guardrails.test.tsx'
      - 'tests/visual-historical-guardrails.test.ts'
      - 'docs/visual/**'
      - 'tests/document-originals.test.ts'
      - 'tests/document-duplicates.test.ts'
      - 'tests/plan-document.test.ts'
      - 'tests/zagra-four-blocks.test.tsx'
      - 'tests/healthy-ageing-notation.test.tsx'
      - 'tests/indicator-worksheet.test.ts'
      - 'tests/planning-instruments.test.ts'
      - 'tests/action-plan-compatibility.test.tsx'
      - 'tests/universal-four-block-action-plan.test.tsx'
      - 'tests/relas-draft-migration.test.ts'
      - 'tests/action-plan-compatibility.smoke.mjs'
      - 'tests/common-action-plan-workspace.smoke.mjs'
      - 'tests/plan-version-delete.smoke.mjs'
      - 'tests/municipality-seed-hydration.test.ts'
      - 'tests/fuente-vaqueros-hydration.smoke.mjs'
      - 'public/seeds/**'
      - '.github/workflows/plan-document.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run tests/document-ingestion-origins.test.ts tests/psl-c-impresion-regimen.test.ts tests/healthy-ageing-notation.test.tsx tests/indicator-worksheet.test.ts tests/planning-instruments.test.ts tests/relas-draft-migration.test.ts tests/action-plan-compatibility.test.tsx tests/universal-four-block-action-plan.test.tsx tests/zagra-four-blocks.test.tsx tests/external-profiles.test.tsx tests/profile-structure.test.ts tests/remote-workspace-lifecycle.test.ts tests/document-originals.test.ts tests/document-access.test.tsx tests/ibse-atarfe-visibility.test.tsx tests/diagnostico-territorial-consolidacion.test.tsx tests/visual-identity-guardrails.test.tsx tests/visual-historical-guardrails.test.ts tests/document-duplicates.test.ts tests/document-revisions.test.ts tests/initial-local-health-plan.test.tsx tests/local-health-plan-outline.test.tsx tests/psl-c-canonical-projector.test.ts tests/plan-document.test.ts tests/plan-editor-whitespace.test.tsx tests/definitive-action-plan-preview.test.tsx tests/municipality-seed-hydration.test.ts tests/planning-cycle-progress.test.tsx tests/planning-cycle-real-status.test.tsx tests/planning-cycle-layout.test.ts tests/profile-prioritization-fidelity.test.tsx tests/profile-custody-audit.test.ts tests/profile-update-preview-integrity.test.ts tests/compact-platform-layout.test.ts tests/home-context-indicator-compact.test.tsx tests/document-archive-manager.test.tsx tests/strategic-reference-separation.test.tsx tests/strategic-migration-audit.test.ts tests/municipal-document-organization.test.ts tests/normalize-loja-atarfe-documents.test.ts tests/normalize-loja-remote-guarded.test.ts tests/agenda-visual-contract.test.ts tests/citizen-participation-summary.test.tsx tests/diagnosis-control-summary.test.tsx tests/ibse-restoration-audit.test.ts tests/local-health-cycle-phase-strip.test.tsx tests/pa-relas-02-ui.test.ts tests/profile-dashboard.test.tsx tests/sam-assess-sample.test.tsx tests/sam-tripyramid.test.tsx tests/nav-desktop-fit.test.ts tests/plan-page-layout.test.ts tests/profile-page-layout.test.ts tests/documentation-platform.test.tsx tests/common-strategic-framework-access.test.ts tests/planning-instruments-by-line.test.tsx tests/granada-zaidin-retired.test.ts
      - run: npx playwright install --with-deps chromium
      - run: node tests/home-municipality-visible.smoke.mjs
      - run: node tests/fuente-vaqueros-hydration.smoke.mjs
      - run: node tests/action-plan-compatibility.smoke.mjs
      - run: node tests/common-action-plan-workspace.smoke.mjs
      - run: node tests/plan-version-delete.smoke.mjs
