name: Plan document validation
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/plan-document.test.ts'
      - 'tests/zagra-four-blocks.test.tsx'
      - 'tests/healthy-ageing-notation.test.tsx'
      - 'tests/indicator-worksheet.test.ts'
      - 'tests/planning-instruments.test.ts'
      - 'tests/action-plan-compatibility.test.tsx'
      - 'tests/relas-draft-migration.test.ts'
      - 'tests/action-plan-compatibility.smoke.mjs'
      - 'tests/municipality-seed-hydration.test.ts'
      - 'tests/fuente-vaqueros-hydration.smoke.mjs'
      - 'public/seeds/**'
      - '.github/workflows/plan-document.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run tests/healthy-ageing-notation.test.tsx tests/indicator-worksheet.test.ts tests/planning-instruments.test.ts tests/relas-draft-migration.test.ts tests/action-plan-compatibility.test.tsx tests/zagra-four-blocks.test.tsx tests/external-profiles.test.tsx tests/remote-workspace-lifecycle.test.ts tests/initial-local-health-plan.test.tsx tests/local-health-plan-outline.test.tsx tests/psl-c-canonical-projector.test.ts tests/zaidin-final-replacement.test.ts tests/plan-document.test.ts tests/plan-editor-whitespace.test.tsx tests/definitive-action-plan-preview.test.tsx tests/municipality-seed-hydration.test.ts
      - run: npx playwright install --with-deps chromium
      - run: node tests/fuente-vaqueros-hydration.smoke.mjs
      - run: node tests/action-plan-compatibility.smoke.mjs
